[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails"
version = "0.1.2"
description = "Optional repo hygiene validator for ai-dev-guardrails packs (AGENTS.md, README, architecture docs, tests/CI indicators)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["agents", "guardrails", "copilot", "claude", "codex", "hygiene"]
dependencies = [
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
ai-guardrails = "ai_guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
